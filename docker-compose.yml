version: "3.9"

# =============================================================
# AI 智能客服系统 — Docker Compose 一键部署
#
# 前置条件:
#   1. 复制 .env.example 为 .env，填入实际的 API Key
#      cp .env.example .env
#   2. 确保 Docker Desktop (Windows/Mac) 或 Docker Engine (Linux) 已安装
#
# 启动: docker compose up -d
# 停止: docker compose down
# 日志: docker compose logs -f backend
# =============================================================

services:
  # ========== PostgreSQL 15 + PgVector ==========
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ai-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Love_Agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Love_Agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis (对话记忆缓存，可选) ==========
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Spring Boot 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-Love_Agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://aigw.asiainfo.com}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-at-least-32-chars}
    ports:
      - "8123:8123"

  # ========== Vue 前端 (Nginx 静态服务 + API 代理) ==========
  frontend:
    build:
      context: ./AI_Agent_Fronted
      dockerfile: Dockerfile
    container_name: ai-agent-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
    driver: local
