services:
  # ========== PostgreSQL + pgvector ==========
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: Love_Agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========== Spring Boot 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      # 数据库（Docker 内部网络，使用服务名 postgres）
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Love_Agent
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # DashScope AI
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      AI_DASHSCOPE_AGENT_KEY: ${DASHSCOPE_AGENT_KEY}
      # 博查 AI 搜索
      AI_BOCHA_API_KEY: ${BOCHA_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chat-memory:/app/chat-memory
      - agent-tmp:/app/tmp

  # ========== nginx 前端 + 反向代理 ==========
  nginx:
    build:
      context: ./AI_Agent_Fronted
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
  chat-memory:
  agent-tmp:
