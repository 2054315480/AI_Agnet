# ==============================================================
# 生产环境配置
# ==============================================================

spring:
  # 注意：不要排除 RedisAutoConfiguration。
  # 一旦排除，StringRedisTemplate 不会注册，cs.session.store=redis 时启动会直接失败。
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      timeout: 5000

  # 本地 PostgreSQL（服务器上安装的）
  datasource:
    url: jdbc:postgresql://localhost:5432/Love_Agent
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # DashScope AI 配置
  ai:
    # 客服链路走 OpenAI 兼容端点（ChatModel）
    openai:
      api-key: ${DASHSCOPE_API_KEY:your_dashscope_api_key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your_dashscope_api_key}
      chat:
        options:
          model: qwen-plus
      image:
        options:
          model: qwen-vl-plus
    vectorstore:
      pgvector:
        initialize-schema: true
    mcp:
      client:
        request-timeout: 60s
        stdio:
          servers-configuration: classpath:MCP-servers.json

# 自定义 AI 配置
ai:
  dashscope:
    agent-key: ${DASHSCOPE_AGENT_KEY:your_agent_key}
  bocha:
    api-key: ${BOCHA_API_KEY:your_bocha_api_key}
    api-url: https://api.bocha.cn/v1/web-search

# HTTP 客户端（生产环境不需要代理）
http:
  client:
    proxy-enabled: false
    connect-timeout: 15000
    read-timeout: 30000

# 生产环境关闭 SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
