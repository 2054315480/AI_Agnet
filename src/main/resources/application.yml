spring:
  application:
   name:AI_Agent
  profiles:
   # local=数据库+API密钥等基础设施配置
   # dev=免费模型配置（省钱模式），生产环境去掉 dev 即可
   active: local,dev
  # datasource: (MySQL 已暂时禁用，改由 application-local.yml 的 PostgreSQL 配置生效)
  #   url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  #   username: root
  #   password: 123456
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 配置（当 chat.memory.type=redis 时启用）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
    port: 8123
    address: 0.0.0.0
    servlet:
     context-path: /api

     vectorstore:
         pgvector:
         index-type: HNSW
         distance-type: COSINE_DISTANCE
         dimensions: 1536
         max-document-batch-size: 10000 # Optional: Maximum number of documents per batch

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名转换（数据库字段下划线 -> Java 属性驼峰）
    map-underscore-to-camel-case: true
    # 使用标准输出日志打印 SQL 语句（开发环境使用）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 表名前缀（如果所有表都有统一前缀可以配置）
      table-prefix: ""
  # 实体类包路径，用于类型别名
  type-aliases-package: com.qh.ai_agent.entity

# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.qh.ai_agent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI Agent 配置
ai:
  # 违禁词列表，使用逗号、分号或空格分隔
  banned-words: 垃圾,暴力,色情,黄色
  # 敏感信息脱敏配置
  sensitive-info:
    enabled: true
    mask-phone: true
    mask-id-card: true
    mask-email: true
    mask-bank-card: true

# 对话记忆配置
chat:
  memory:
    # 存储类型: file, mysql, redis
    type: file
    # 文件存储目录（当 type=file 时使用）
    file-dir: ./chat-memory
    # Redis 配置（当 type=redis 时使用）
    redis:
      key-prefix: "chat:memory:"
      ttl-hours: 24
