# ==============================================================
# 开发环境配置 —— 阿里云百炼 DashScope（OpenAI 兼容模式端点）
# 切回公司网关时：模型名加 aliyun/ 前缀，如 aliyun/qwen3.6-plus
# 激活方式：将 application.yml 中的 spring.profiles.active 改为 "local,dev"
# ==============================================================

spring:
  ai:
    openai:
      chat:
        options:
          # 公司网关可用模型（OpenAI 兼容端点）：
          #   aliyun/qwen3.6-plus（推荐，30K RPM，工具调用兼容性最佳）
          #   aliyun/deepseek-v3.2（15K RPM）
          #   aliyun/glm-5（500 RPM）
          #   aliyun/kimi-k2.5（500 RPM）
          #   aliyun/MiniMax-M2.5（500 RPM，需开启思考模式）
          model: qwen-plus
      image:
        options:
          model: qwen-vl-plus
    dashscope:
      chat:
        enabled: false  # 通过 OpenAI 兼容端点使用 DashScope，禁用原生 ChatModel
